org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Loom 은 아직 그레이들 구성 캐시와 호환되지 않는다.
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# 버전 업 시 이 파일만 고치면 된다.  https://fabricmc.net/develop 에서 확인.
# 2026-07-29 조회 기준값.
#
# 컴파일은 지원 범위의 "가장 낮은" 버전(26.1.2)에 대고 한다.
# 26.2 에서 옮겨간 API 는 McCompat 이 런타임에 흡수하므로, 낮은 쪽으로 컴파일해야
# 양쪽 모두에 존재하는 심볼만 바이트코드에 남는다. 반대로 하면 26.1 에서 깨진다.
# ---------------------------------------------------------------------------
minecraft_version=26.1.2
loader_version=0.19.3
fabric_api_version=0.155.2+26.1.2
loom_version=1.17.17

# Minecraft 26.1+ 는 Java 25 런타임을 요구한다 (version manifest javaVersion.majorVersion=25).
java_version=25

# fabric.mod.json 의 의존성 하한. 26.1 / 26.2 를 한 jar 로 지원한다.
minecraft_dependency=>=26.1

# ---------------------------------------------------------------------------
# Mod
# ---------------------------------------------------------------------------
mod_version=1.0.0
maven_group=kr.hyperspruce
archives_base_name=korean-patch

# ---------------------------------------------------------------------------
# 빌드한 jar 을 자동으로 복사해 넣을 폴더. 비워 두면 복사하지 않는다.
#
# 사람마다 경로가 다르므로 여기에는 적지 않는다. 자기 경로는 둘 중 하나로 준다.
#   - ~/.gradle/gradle.properties 에  test_mods_dir=C:/.../.minecraft/mods
#   - 또는 빌드할 때  ./gradlew build -Ptest_mods_dir=C:/.../.minecraft/mods
#
# 역슬래시는 이스케이프로 먹히므로 슬래시로 적는다.
# ---------------------------------------------------------------------------
test_mods_dir=
